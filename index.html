<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Thi 100 Câu Trắc Nghiệm Tin Học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4338ca;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      --primary-light: #e0e7ff;
      --success: #059669;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px 16px;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 780px; }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .menu-header { text-align: center; margin-bottom: 28px; }
    .badge-top {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      background: var(--primary-light);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .menu-header h1 { margin: 0 0 8px 0; font-size: 1.75rem; font-weight: 700; }
    .menu-header p { margin: 0; color: var(--text-sub); font-size: 0.95rem; }

    .module-list { display: flex; flex-direction: column; gap: 14px; }
    .btn-module {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 18px 22px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-module:hover {
      border-color: var(--primary);
      background: #faf5ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.12);
      color: var(--primary);
    }
    .btn-module .module-tag {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text-sub);
    }

    .quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-back {
      background: none;
      border: none;
      font-family: inherit;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .btn-back:hover { background: var(--bg); color: var(--primary); }
    .score-badge {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 5px 12px;
      border-radius: 9999px;
    }

    .progress-track { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 24px; }
    .progress-bar { height: 100%; width: 0%; background: var(--primary-gradient); transition: width 0.35s ease; }

    .question-title { font-size: 1.22rem; font-weight: 700; line-height: 1.55; margin-bottom: 24px; color: #0f172a; }
    .options-box { display: flex; flex-direction: column; gap: 12px; }
    .btn-opt {
      width: 100%;
      text-align: left;
      padding: 16px 20px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.98rem;
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: all 0.15s ease;
      line-height: 1.45;
    }
    .btn-opt:hover:not(:disabled) { border-color: #94a3b8; background: #f8fafc; }
    .btn-opt .opt-letter {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--bg);
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-sub);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .btn-opt.correct { background: var(--success-bg) !important; border-color: var(--success) !important; color: #064e3b !important; font-weight: 600; }
    .btn-opt.correct .opt-letter { background: var(--success); color: #ffffff; }
    .btn-opt.wrong { background: var(--danger-bg) !important; border-color: var(--danger) !important; color: #7f1d1d !important; }
    .btn-opt.wrong .opt-letter { background: var(--danger); color: #ffffff; }

    .feedback-panel {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }
    .feedback-panel.show { display: block; }

    .bottom-row { margin-top: 28px; display: flex; justify-content: flex-end; }
    .btn-action {
      padding: 13px 28px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .btn-action:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

    .result-box { text-align: center; padding: 20px 0; }
    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-weight: 700;
      font-size: 2.2rem;
    }
    .score-circle span { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <!-- MENU 4 BÀI THI -->
    <div id="menu-view">
      <div class="menu-header">
        <span class="badge-top">100 Câu Hỏi Trắc Nghiệm Tin Học</span>
        <h1>Bộ Đề Ôn Tập 4 Bài Chuẩn</h1>
        <p>Mỗi bài 25 câu hỏi • Tự động xáo trộn câu & đáp án ngẫu nhiên</p>
      </div>
      <div class="module-list">
        <button class="btn-module" onclick="startModule('bai1')">
          <span>📝 Bài 1: Câu 01 – Câu 25 (Tổng hợp căn bản)</span>
          <span class="module-tag">25 câu</span>
        </button>
        <button class="btn-module" onclick="startModule('bai2')">
          <span>📝 Bài 2: Câu 26 – Câu 50 (Word, Excel & PowerPoint)</span>
          <span class="module-tag">25 câu</span>
        </button>
        <button class="btn-module" onclick="startModule('bai3')">
          <span>📝 Bài 3: Câu 51 – Câu 75 (Hàm Logic & Kỹ thuật văn phòng)</span>
          <span class="module-tag">25 câu</span>
        </button>
        <button class="btn-module" onclick="startModule('bai4')">
          <span>📝 Bài 4: Câu 76 – Câu 100 (Thao tác nâng cao & Ôn tập)</span>
          <span class="module-tag">25 câu</span>
        </button>
      </div>
    </div>

    <!-- MÀN HÌNH QUIZ -->
    <div id="quiz-view" style="display: none;">
      <div class="quiz-nav">
        <button class="btn-back" onclick="returnToMenu()">← Thoát ra danh sách bài</button>
        <div class="score-badge" id="hud-score">Điểm: 0</div>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-text">Câu hỏi đang tải...</div>
      <div class="options-box" id="options-box"></div>
      <div class="feedback-panel" id="feedback-panel"></div>

      <div class="bottom-row">
        <button class="btn-action" id="btn-next" onclick="nextQuestion()" disabled>Câu tiếp theo →</button>
      </div>
    </div>

    <!-- KẾT QUẢ -->
    <div id="result-view" class="result-box" style="display: none;">
      <div class="score-circle">
        <div id="final-percent">100%</div>
        <span>Chính xác</span>
      </div>
      <h2 style="margin: 0 0 8px 0;">Hoàn thành bài kiểm tra!</h2>
      <p id="final-summary" style="color: var(--text-sub); margin-bottom: 26px; font-size: 1.05rem;"></p>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn-action" onclick="retryCurrent()">Làm lại đề này (Đổi câu)</button>
        <button class="btn-module" style="width: auto; padding: 13px 22px;" onclick="returnToMenu()">Chọn bài khác</button>
      </div>
    </div>

  </div>
</div>

<script>
const examData = {
  // BÀI 1: CÂU 1 - 25
  bai1: [
    { q: "Bộ nhớ truy cập ngẫu nhiên RAM được viết tắt là:", options: ["Read Access Memory", "Rewrite Access Memory", "Random Access Memory", "Secondary Memory"], correct: 2, explain: "RAM là Random Access Memory." },
    { q: "Trong Microsoft Word 2010, khi chọn Page Layout\\Page Setup\\Orientation\\Landscape có nghĩa là:", options: ["Chọn hướng giấy ngang", "Chọn hướng giấy dọc", "Điều chỉnh lề cho trang giấy", "Cả 3 ý trên đều sai"], correct: 0, explain: "Landscape là hướng giấy nằm ngang (Portrait là dọc)." },

    { q: "Trong Windows, muốn chuyển đổi nhanh giữa các cửa sổ đang mở, sử dụng tổ hợp phím:", options: ["Alt + Tab", "Alt + Shift", "Alt + Home", "Alt + Enter"], correct: 0, explain: "Alt + Tab dùng để luân chuyển giữa các cửa sổ đang chạy." },

    { q: "Trong Word 2010, để chọn nhiều hình không liền kề thì cần giữ thêm phím nào:", options: ["Shift", "Ctrl", "Alt", "Tab"], correct: 1, explain: "Giữ phím Ctrl cho phép chọn nhiều hình vẽ rời rạc." },
    { q: "Trong Word 2010, để chuyển đổi chữ thường thành chữ in hoa (hoặc ngược lại) có thể dùng:", options: ["Ctrl + Shift + C", "Ctrl + Shift + A", "Ctrl + Shift + B", "Ctrl + Shift + D"], correct: 1, explain: "Ctrl + Shift + A đổi nhanh chữ thường thành in hoa toàn bộ (hoặc dùng Shift + F3)." },

// THUẬT TOÁN ĐẢO ĐỀ (FISHER-YATES SHUFFLE)
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let activeModuleKey = '';
let currentQuestions = [];
let currentIdx = 0;
let userScore = 0;
let isAnswered = false;

function startModule(key) {
  activeModuleKey = key;
  const original = examData[key];
  
  // Tự động xáo trộn cả câu hỏi và thứ tự các đáp án
  currentQuestions = shuffle(original).map(item => {
    const correctVal = item.options[item.correct];
    const shuffledOpts = shuffle(item.options);
    return {
      q: item.q,
      options: shuffledOpts,
      correct: shuffledOpts.indexOf(correctVal),
      explain: item.explain
    };
  });

  currentIdx = 0;
  userScore = 0;

  document.getElementById("menu-view").style.display = "none";
  document.getElementById("result-view").style.display = "none";
  document.getElementById("quiz-view").style.display = "block";

  renderQuestion();
}

function retryCurrent() {
  startModule(activeModuleKey);
}

function returnToMenu() {
  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("result-view").style.display = "none";
  document.getElementById("menu-view").style.display = "block";
}

function renderQuestion() {
  isAnswered = false;
  const q = currentQuestions[currentIdx];

  const pct = (currentIdx / currentQuestions.length) * 100;
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("hud-score").innerText = `Câu ${currentIdx + 1}/${currentQuestions.length} • Đúng: ${userScore}`;
  document.getElementById("question-text").innerText = `${currentIdx + 1}. ${q.q}`;
  document.getElementById("btn-next").disabled = true;

  const fb = document.getElementById("feedback-panel");
  fb.className = "feedback-panel";
  fb.innerText = "";

  const box = document.getElementById("options-box");
  box.innerHTML = "";

  const letters = ["A", "B", "C", "D"];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "btn-opt";
    btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> <span>${opt}</span>`;
    btn.onclick = () => chooseAnswer(idx, btn);
    box.appendChild(btn);
  });
}

function chooseAnswer(selectedIdx, btnEl) {
  if (isAnswered) return;
  isAnswered = true;

  const q = currentQuestions[currentIdx];
  const allBtns = document.querySelectorAll(".btn-opt");

  if (selectedIdx === q.correct) {
    btnEl.classList.add("correct");
    userScore++;
  } else {
    btnEl.classList.add("wrong");
    allBtns[q.correct].classList.add("correct");
  }

  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById("feedback-panel");
  fb.innerText = "💡 Giải thích: " + q.explain;
  fb.classList.add("show");

  document.getElementById("hud-score").innerText = `Câu ${currentIdx + 1}/${currentQuestions.length} • Đúng: ${userScore}`;
  document.getElementById("btn-next").disabled = false;
}

function nextQuestion() {
  if (currentIdx < currentQuestions.length - 1) {
    currentIdx++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("progress-bar").style.width = "100%";
  document.getElementById("quiz-view").style.display = "none";
  document.getElementById("result-view").style.display = "block";

  const pct = Math.round((userScore / currentQuestions.length) * 100);
  document.getElementById("final-percent").innerText = pct + "%";
  document.getElementById("final-summary").innerText = `Bạn đạt ${userScore}/${currentQuestions.length} câu chính xác.`;
}
</script>
</body>
</html>
